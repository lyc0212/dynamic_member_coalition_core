[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-member-coalition-core"
version = "0.1.0"
description = "Reproducible classical dynamic-coalition pursuit benchmark"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "scipy==1.15.3"]

[project.scripts]
pursuit-v2 = "pursuit_v2.cli:main"

[tool.setuptools.packages.find]
include = ["pursuit_v2*", "research", "research.quality_allocation*"]

[tool.setuptools.package-data]
pursuit_v2 = ["replay_template.html"]
